name: publish-backend

on:
  workflow_call:
    inputs:
      version: { required: true, type: string }
      major: { required: true, type: string }
      minor: { required: true, type: string }

  # For re-publishing a version whose original run failed. Creates no release and moves no tag.
  workflow_dispatch:
    inputs:
      version: { required: true, type: string, description: "Exact semver, e.g. 0.1.0" }
      major: { required: true, type: string, description: "Major, e.g. 0" }
      minor: { required: true, type: string, description: "Minor, e.g. 1" }

permissions:
  # write, to attach the stack bundle to the release.
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A manual re-publish runs from whatever branch it was dispatched on, so it checks out the version's
      # own tag: the image and the bundle have to be that version's files. A release-please run is already
      # on the released commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('backend-v{0}', inputs.version) || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths must be lowercase whether or not the account is. Derived rather than hardcoded
      # so a fork publishes to its own namespace.
      - id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/kvitteria-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          # The build context is Kvitteria/, not the repo root — that is where both props files and
          # global.json live, and the Dockerfile copies them before restore.
          context: ./Kvitteria
          file: ./Kvitteria/Backend/Dockerfile
          push: true
          # Exact, floating minor, floating major, and latest, so users pin as tightly as they want.
          # Note that while this is 0.x, the floating major is not a stability promise.
          tags: |
            ${{ steps.image.outputs.repo }}:${{ inputs.version }}
            ${{ steps.image.outputs.repo }}:${{ inputs.major }}.${{ inputs.minor }}
            ${{ steps.image.outputs.repo }}:${{ inputs.major }}
            ${{ steps.image.outputs.repo }}:latest
          # Stamped into the assembly, and reported by GET /version.
          build-args: |
            VERSION=${{ inputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
          # amd64 only. arm64 needs QEMU and roughly triples the build; add it when somebody wants to
          # run this on a Pi — though CPU extraction there would be painful regardless.
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # After the push and only after it: every client reads "has a bundle" as "can be installed", so a
      # failed push above leaves the previous release the newest available. --clobber lets a re-publish
      # replace the assets rather than fail on them.
      - name: Attach the stack bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          bash scripts/bundle.sh "$VERSION" dist
          gh release upload "backend-v${VERSION}" \
            "dist/kvitteria-stack-${VERSION}.tar.gz" \
            "dist/kvitteria-stack-${VERSION}.sha256" \
            --clobber
