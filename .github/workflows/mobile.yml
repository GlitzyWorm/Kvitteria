name: mobile

# Paths rather than every push: a Gradle build is minutes of runner time that a backend-only change
# should not pay. The OpenAPI snapshot is in the list because the app's contract test reads it, so an
# API change can fail this build without touching android/.
#
# Note that `test.yml` deliberately has no paths filter. If it is ever made a required check, a
# path-skipped run stays pending forever and nothing can merge.
on:
  pull_request:
    paths:
      - "android/**"
      - "docs/openapi/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "docs/openapi/**"
      - ".github/workflows/mobile.yml"

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image carries the Android SDK; this reads the platform and build tools from it.
      - uses: gradle/actions/setup-gradle@v4

      # Header check first: it is the cheapest failure, and MPL-2.0 coverage is per file.
      - run: ./gradlew spotlessCheck

      - run: ./gradlew testDebugUnitTest test

      - run: ./gradlew lintDebug

      # Runs R8, so a serialization keep-rule problem that only appears when minified fails here.
      # versionCode only ever increases, which a semver string cannot supply; the run number can.
      - run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }}
