name: test

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Where both props files and global.json live.
        working-directory: Kvitteria
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Honours Kvitteria/global.json, so CI and a developer machine agree on the SDK.
          global-json-file: Kvitteria/global.json

      # Scoped to the test project rather than the solution: Kvitteria.slnx now contains MobileApp,
      # whose Mac Catalyst target cannot build on Linux at all and whose Android target would pull a
      # MAUI workload install into every backend pull request. The project reference chain still
      # covers everything this job cares about — Backend.Tests → Backend → Contracts.
      - run: dotnet restore Backend.Tests/Backend.Tests.csproj

      # Backend.csproj and Contracts.csproj both set TreatWarningsAsErrors, so a new analyzer wave
      # fails here rather than accumulating unnoticed in build output.
      - run: dotnet build Backend.Tests/Backend.Tests.csproj --no-restore --configuration Release

      - run: dotnet test Backend.Tests/Backend.Tests.csproj --no-build --configuration Release --verbosity normal
