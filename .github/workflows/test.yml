name: test

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Where the solution and both props files live.
        working-directory: Kvitteria
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Honours Kvitteria/global.json, so CI and a developer machine agree on the SDK.
          global-json-file: Kvitteria/global.json

      - run: dotnet restore

      # Backend.csproj sets TreatWarningsAsErrors, so a new analyzer wave fails here rather than
      # accumulating unnoticed in build output.
      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release --verbosity normal
